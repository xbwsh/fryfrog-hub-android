name: fryfrog_hub
description: Fryfrog Hub media client — Flutter rewrite with liquid glass UI.
publish_to: 'none'
version: 2.1.17+19

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^1.7.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  cached_network_image: ^3.4.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  image_cropper: ^12.2.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
