name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Needed only to publish release assets on tag pushes.
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the version used for local development.
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Setup release keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Tag builds need the KEYSTORE_* repository secrets to sign the release APK"
              exit 1
            fi
            echo "No keystore secrets — falling back to debug signing."
            exit 0
          fi
          for v in "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$v" ]; then
              echo "::error::KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD must all be set too"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" \
            "$KEY_PASSWORD" \
            "$KEY_ALIAS" \
            "release.keystore" > android/key.properties

      - name: Resolve version from tag
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
            if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag must look like vX.Y.Z (got $GITHUB_REF_NAME)"
              exit 1
            fi
            echo "name=$v" >> "$GITHUB_OUTPUT"
            echo "number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          BUILD_NAME: ${{ steps.ver.outputs.name }}
          BUILD_NUMBER: ${{ steps.ver.outputs.number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            flutter build apk --release \
              --build-name="$BUILD_NAME" \
              --build-number="$BUILD_NUMBER"
          else
            flutter build apk --release
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fryfrog-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="fryfrog-hub-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
