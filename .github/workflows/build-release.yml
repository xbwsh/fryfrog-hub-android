name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，格式 x.y.z+buildNumber（如 2.1.0+5）"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Verify version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
            echo "::error::版本号格式应为 x.y.z+buildNumber，例如 2.1.0+5（当前：$VERSION）"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          NAME="${VERSION%%+*}"
          NUM="${VERSION##*+}"
          flutter build apk --release --build-name="$NAME" --build-number="$NUM"

      - name: Rename APK
        env:
          VERSION: ${{ inputs.version }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "fryfrog_hub_${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fryfrog_hub-${{ inputs.version }}
          path: fryfrog_hub_*.apk
          if-no-files-found: error
